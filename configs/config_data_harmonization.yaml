    technology_mapping:
      solar:
      - "Solar photovoltaic"
      - "Solar thermal energy"
      onwind:
      - "Onshore wind energy"
      offwind-dc:
      - "Offshore wind energy"
      ror:
      - "Renewable hydropower"
