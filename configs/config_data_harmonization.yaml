      - "Pumped storage"
      other:
      - "Other non-renewable energy"
      - "Marine energy"
      biomass:
      - "Liquid biofuels"
      - "Biogas"
      - "Solid biofuels"
      geothermal:
      - "Geothermal energy"
      CCGT:
      - "Natural gas"
      waste:
