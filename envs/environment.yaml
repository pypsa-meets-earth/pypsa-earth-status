name: pypsa-earth-status
channels:
- conda-forge
- bioconda
dependencies:
- python >=3.10,<3.13
- cartopy
- country_converter
- geopandas
- graphviz
- matplotlib
- numpy
- openpyxl
- pandas <3.1  # country_converter 1.3.2 breaks with pandas 3.1, see IndEcol/country_converter#180
- pulp <2.8
- pyproj
- pypsa >=0.25,<=0.30
- pyyaml
- shapely
- snakemake-minimal
- snakemake-storage-plugin-http
